name: Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Prepare patched tree
        run: bash scripts/prepare-loophole.sh
        env:
          TARGET: ${{ github.workspace }}/loophole-build

      # NOTE: skeleton - validate the build commands before enabling releases.
      - name: Install dependencies
        run: cd loophole-build && bun install

      - name: Build CLI
        run: cd loophole-build && bun run --cwd packages/cli script/build.ts

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-windows
          path: loophole-build/packages/cli/dist
          if-no-files-found: warn
