name: Build

# Test builds only: nothing here publishes or releases. Output goes to the run's artifacts.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Prepare patched tree
        run: bash scripts/prepare-loophole.sh
        env:
          TARGET: ${{ github.workspace }}/loophole-build

      - name: Install dependencies
        run: cd loophole-build && bun install

      - name: Build CLI
        run: cd loophole-build && bun run --cwd packages/cli build

      - name: Upload CLI artifact (test build only)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-windows
          path: loophole-build/packages/cli/dist
          if-no-files-found: warn
