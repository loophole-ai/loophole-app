name: CI - Build - macOS

# Same shape as ci-build-windows.yml and VSCodium's ci-build-macos.yml:
# clone upstream at the pin, apply patches, build the CLI, upload.
# Two runners: Intel (x64 baseline) and Apple Silicon (arm64).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions: {}

env:
  APP_NAME: Loophole
  BINARY_NAME: loophole
  ORG_NAME: loophole-ai
  GH_REPO_PATH: ${{ github.repository }}
  OPENCODE_CHANNEL: prod

jobs:
  build-macos:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            target: darwin-x64-baseline
            dist: cli-darwin-x64-baseline
          - runner: macos-14
            arch: arm64
            target: darwin-arm64
            dist: cli-darwin-arm64
    env:
      OS_NAME: osx
      # Build exactly one target per runner instead of every host target.
      OPENCODE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Clone upstream opencode
        run: bash ./get_repo.sh

      - name: Apply patches and assets
        run: bash ./prepare_src.sh

      - name: Build CLI
        run: bash ./build.sh

      - name: Upload CLI binary to gofile
        run: |
          cd opencode
          BIN=packages/cli/dist/${{ matrix.dist }}/bin/loophole
          ls -la "$BIN"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          RESP=$(curl -s -F "file=@$BIN;filename=loophole-macos-${{ matrix.arch }}" "https://$SERVER.gofile.io/contents/uploadfile")
          echo "$RESP" | jq .
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          if [ -z "$LINK" ]; then echo "## gofile upload failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          {
            echo "## Loophole CLI (macOS ${{ matrix.arch }})"
            echo ""
            echo "**Download:** $LINK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI binary artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-macos-${{ matrix.arch }}
          path: opencode/packages/cli/dist/${{ matrix.dist }}/bin/loophole
          if-no-files-found: error
