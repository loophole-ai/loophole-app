name: CI - Build Desktop - Windows

# Desktop build for Windows x64: clone upstream at the pin, apply patches, build
# the CLI, build and package the Electron app, upload.
#
# Packaging mirrors loophole-ai/forge's desktop-builder: one electron-builder
# pass that produces the real NSIS installer, not pack.ts's unpacked app plus a
# second pass.
#
# Desktop and CLI versions are separate, exactly like forge's desktop-builder:
#
#   * desktop app version -> OPENCODE_VERSION for the app build/package steps.
#     The app's updater has allowDowngrade = true and reads
#     loophole-ai/desktop/releases/latest, so this must never be higher than
#     the published release unless that release is published too. Otherwise
#     every launch installs the published build over the local one.
#   * bundled CLI version -> OPENCODE_VERSION for the CLI build. It is stamped
#     into the binary and into resources/loophole-cli.version.
#
# Both default to the latest published release and can be overridden from the
# workflow_dispatch inputs. No version lives in the patch stack.
#
# The desktop bundles the CLI from packages/cli/dist, and its target names use
# the non-baseline form (windows-x64), so the CLI is built as
# windows-x64-baseline (which is what that target maps to).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version (empty = latest loophole-ai/desktop release)"
        required: false
        default: ""
      cli_version:
        description: "Bundled CLI version (empty = latest loophole-ai/cli release)"
        required: false
        default: ""

permissions: {}

env:
  APP_NAME: Loophole
  BINARY_NAME: loophole
  ORG_NAME: loophole-ai
  GH_REPO_PATH: ${{ github.repository }}
  OPENCODE_CHANNEL: prod

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Clone upstream opencode
        run: bash ./get_repo.sh

      - name: Apply patches and assets
        run: bash ./prepare_src.sh

      - name: Resolve versions
        id: versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          desktop="${{ inputs.version }}"
          cli="${{ inputs.cli_version }}"
          if [ -z "$desktop" ]; then
            desktop=$(curl -fsSL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/loophole-ai/desktop/releases/latest \
              | jq -r '.tag_name // empty' | sed 's/^v//')
          fi
          if [ -z "$cli" ]; then
            cli=$(curl -fsSL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/loophole-ai/cli/releases/latest \
              | jq -r '.tag_name // empty' | sed 's/^v//')
          fi
          if [ -z "$desktop" ] || [ -z "$cli" ]; then
            echo "::error::could not resolve versions (desktop='$desktop' cli='$cli')"
            exit 1
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          {
            echo "### Versions"
            echo ""
            echo "| artifact | version | source |"
            echo "|---|---|---|"
            echo "| desktop app | \`$desktop\` | loophole-ai/desktop latest |"
            echo "| bundled CLI | \`$cli\` | loophole-ai/cli latest |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build CLI
        run: bash ./build.sh
        env:
          BUILD_TARGET: cli
          OPENCODE_TARGET: windows-x64-baseline
          OPENCODE_VERSION: ${{ steps.versions.outputs.cli }}

      - name: Build desktop app
        run: cd opencode && bun run --cwd packages/desktop build
        env:
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ steps.versions.outputs.desktop }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package desktop app (unsigned, no publish)
        working-directory: opencode/packages/desktop
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        env:
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ steps.versions.outputs.desktop }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer to gofile
        run: |
          cd opencode/packages/desktop/dist
          EXE=$(find . -maxdepth 1 -name "*.exe" | head -n 1)
          ls -la "$EXE"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          RESP=$(curl -s -F "file=@$EXE;filename=loophole-desktop-windows-x64.exe" "https://$SERVER.gofile.io/contents/uploadfile")
          echo "$RESP" | jq .
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          if [ -z "$LINK" ]; then echo "## gofile upload failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          {
            echo "## Loophole Desktop (windows x64, unsigned installer)"
            echo ""
            echo "Version: \`${{ steps.versions.outputs.desktop }}\` (bundled CLI \`${{ steps.versions.outputs.cli }}\`)"
            echo ""
            echo "**Download:** $LINK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-desktop-windows-installer
          path: opencode/packages/desktop/dist/*.exe
          if-no-files-found: error
