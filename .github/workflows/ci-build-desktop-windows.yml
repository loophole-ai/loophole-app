name: CI - Build Desktop - Windows

# Desktop build for Windows x64, same shape as ci-build-windows.yml:
# clone upstream at the pin, apply patches, build the CLI, build and package
# the Electron app, upload.
#
# The desktop bundles the CLI from packages/cli/dist, and its target names use
# the non-baseline form (windows-x64), so the CLI is built as
# windows-x64-baseline (which is what that target maps to) and the desktop is
# built against windows-x64.
#
# Packaging is two passes: electron-builder --dir produces the unpacked app,
# then a second pass wraps that app in the NSIS installer.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions: {}

env:
  APP_NAME: Loophole
  BINARY_NAME: loophole
  ORG_NAME: loophole-ai
  GH_REPO_PATH: ${{ github.repository }}
  OPENCODE_CHANNEL: prod

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Clone upstream opencode
        run: bash ./get_repo.sh

      - name: Apply patches and assets
        run: bash ./prepare_src.sh

      - name: Build CLI
        run: bash ./build.sh
        env:
          BUILD_TARGET: cli
          OPENCODE_TARGET: windows-x64-baseline

      - name: Build desktop app
        run: cd opencode && bun run --cwd packages/desktop build
        env:
          OPENCODE_TARGET: windows-x64
          NODE_OPTIONS: --max-old-space-size=4096

      # First pass: unpacked app (packages/desktop/dist -> dist/desktop/app).
      - name: Pack desktop app (unsigned, no publish)
        run: cd opencode && bun run --cwd packages/desktop pack
        env:
          OPENCODE_TARGET: windows-x64

      # Second pass: wrap the unpacked app in the NSIS installer. Copy it out of
      # dist/ first because pack wipes dist/ at startup.
      - name: Copy unpacked app aside
        run: cp -r opencode/dist/desktop/app opencode/.app-for-installer

      - name: Pack NSIS installer (unsigned, no publish)
        run: cd opencode && bun run --cwd packages/desktop pack
        env:
          OPENCODE_TARGET: windows-x64
          OPENCODE_DESKTOP_APP: ${{ github.workspace }}/opencode/.app-for-installer

      - name: Upload installer to gofile
        run: |
          cd opencode
          EXE=$(find dist/desktop -maxdepth 1 -name "*.exe" | head -n 1)
          ls -la "$EXE"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          RESP=$(curl -s -F "file=@$EXE;filename=loophole-desktop-windows-x64.exe" "https://$SERVER.gofile.io/contents/uploadfile")
          echo "$RESP" | jq .
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          if [ -z "$LINK" ]; then echo "## gofile upload failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          {
            echo "## Loophole Desktop (windows x64, unsigned installer)"
            echo ""
            echo "**Download:** $LINK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-desktop-windows-installer
          path: opencode/dist/desktop/*.exe
          if-no-files-found: error
