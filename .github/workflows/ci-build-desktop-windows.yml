name: CI - Build Desktop - Windows

# Desktop build for Windows x64: check out the Loophole source branch, build
# the CLI, build and package the Electron app, upload.
#
# Packaging mirrors loophole-ai/forge's desktop-builder: one electron-builder
# pass that produces the real NSIS installer, not pack.ts's unpacked app plus a
# second pass.
#
# Desktop and CLI versions are separate, exactly like forge's desktop-builder:
#
#   * desktop app version -> OPENCODE_VERSION for the app build/package steps.
#     The updater only moves forward (allowDowngrade = false), so a test build
#     can run ahead of the published desktop release without reinstalling the
#     older published build on launch.
#   * bundled CLI version -> OPENCODE_VERSION for the CLI build. It is stamped
#     into the binary and into resources/loophole-cli.version.
#
# Both default to pinned versions (1.1.8) and can be overridden from the
# workflow_dispatch inputs. No version lives in the patch stack.
#
# The desktop bundles the CLI from packages/cli/dist, and its target names use
# the non-baseline form (windows-x64), so the CLI is built as
# windows-x64-baseline (which is what that target maps to).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version (empty = 1.1.11)"
        required: false
        default: ""
      cli_version:
        description: "Bundled CLI version (empty = 1.1.8)"
        required: false
        default: ""

permissions:
  contents: read

env:
  APP_NAME: Loophole
  BINARY_NAME: loophole
  ORG_NAME: loophole-ai
  GH_REPO_PATH: ${{ github.repository }}
  OPENCODE_CHANNEL: prod

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Check out the Loophole source
        run: bash ./get_repo.sh

      - name: Prepare the source tree
        run: bash ./prepare_src.sh

      - name: Resolve versions
        id: versions
        run: |
          desktop="${{ inputs.version }}"
          cli="${{ inputs.cli_version }}"
          if [ -z "$desktop" ]; then
            # Pinned desktop version; bump when cutting a new desktop release.
            desktop="1.1.11"
          fi
          if [ -z "$cli" ]; then
            # Pinned bundled CLI version; bump when cutting a new CLI.
            cli="1.1.8"
          fi
          if [ -z "$desktop" ] || [ -z "$cli" ]; then
            echo "::error::could not resolve versions (desktop='$desktop' cli='$cli')"
            exit 1
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          {
            echo "### Versions"
            echo ""
            echo "| artifact | version | source |"
            echo "|---|---|---|"
            echo "| desktop app | \`$desktop\` | pinned desktop version |"
            echo "| bundled CLI | \`$cli\` | pinned CLI version |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build CLI
        run: bash ./build.sh
        env:
          BUILD_TARGET: cli
          OPENCODE_TARGET: windows-x64-baseline
          OPENCODE_VERSION: ${{ steps.versions.outputs.cli }}

      - name: Build desktop app
        run: cd opencode && bun run --cwd packages/desktop build
        env:
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ steps.versions.outputs.desktop }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package desktop app (unsigned, no publish)
        working-directory: opencode/packages/desktop
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        env:
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ steps.versions.outputs.desktop }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package portable zip
        run: |
          cd opencode/packages/desktop/dist
          DIR=$(find . -maxdepth 1 -type d -name "*unpacked*" | head -n 1)
          if [ -z "$DIR" ]; then echo "::error::no unpacked app directory"; exit 1; fi
          rm -f loophole-desktop-windows-x64.zip
          ( cd "$DIR" && 7z a -tzip ../loophole-desktop-windows-x64.zip ./* > /dev/null )
          ls -lh loophole-desktop-windows-x64.zip

      - name: Upload portable zip to gofile
        run: |
          cd opencode/packages/desktop/dist
          ZIP=loophole-desktop-windows-x64.zip
          ls -la "$ZIP"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          RESP=$(curl -s -F "file=@$ZIP;filename=$ZIP" "https://$SERVER.gofile.io/contents/uploadfile")
          echo "$RESP" | jq .
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          if [ -z "$LINK" ]; then echo "## gofile upload failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          {
            echo "## Loophole Desktop (windows x64, unsigned portable zip)"
            echo ""
            echo "Version: \`${{ steps.versions.outputs.desktop }}\` (bundled CLI \`${{ steps.versions.outputs.cli }}\`)"
            echo ""
            echo "**Download:** $LINK"
          } >> "$GITHUB_STEP_SUMMARY"
