name: Build Branch

# Manual test build of any branch: builds the CLI exe and uploads it to gofile.
# Full-source branches (e.g. opencode) build in place; patch-only branches
# (e.g. main) are assembled into loophole-build first.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build (opencode, main, ...)
        required: true
        default: opencode

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: oven-sh/setup-bun@v2

      - name: Detect build layout
        run: |
          if [ -f packages/cli/package.json ]; then
            # Full source checkout: build in place.
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
          else
            # Patch-only checkout: assemble upstream + patches first.
            TARGET="$GITHUB_WORKSPACE/loophole-build" bash scripts/prepare-loophole.sh
            echo "BUILD_DIR=loophole-build" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: cd "$BUILD_DIR" && bun install

      - name: Build CLI
        run: cd "$BUILD_DIR" && bun run --cwd packages/cli build --single --baseline

      - name: Upload CLI exe to gofile
        run: |
          cd "$BUILD_DIR"
          EXE=packages/cli/dist/cli-windows-x64-baseline/bin/loophole.exe
          ls -la "$EXE"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          RESP=$(curl -s -F "file=@$EXE;filename=loophole-windows-x64.exe" "https://$SERVER.gofile.io/contents/uploadfile")
          echo "$RESP" | jq .
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          if [ -z "$LINK" ]; then echo "## gofile upload failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          {
            echo "## Loophole CLI (windows x64) - branch ${{ inputs.branch }}"
            echo ""
            echo "**Download:** $LINK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI exe artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-windows-exe
          path: ${{ env.BUILD_DIR }}/packages/cli/dist/cli-windows-x64-baseline/bin/loophole.exe
          if-no-files-found: error
