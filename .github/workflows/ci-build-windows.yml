name: CI - Build - Windows

# The single CLI build path, same shape as VSCodium: clone upstream at the pin,
# apply patches, build, upload. There is no branch detection and no second
# layout to keep in sync.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version (empty = latest loophole-ai/cli release)"
        required: false
        default: ""

permissions: {}

env:
  APP_NAME: Loophole
  BINARY_NAME: loophole
  ORG_NAME: loophole-ai
  GH_REPO_PATH: ${{ github.repository }}
  OS_NAME: windows
  OPENCODE_CHANNEL: prod

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Build exactly one target instead of every host target (x64 + baseline).
      OPENCODE_TARGET: windows-x64-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Clone upstream opencode
        run: bash ./get_repo.sh

      - name: Apply patches and assets
        run: bash ./prepare_src.sh

      # The CLI version is the published CLI release, not the desktop app's
      # version and not a constant in a patch. Override with the dispatch input.
      - name: Resolve CLI version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/loophole-ai/cli/releases/latest \
              | jq -r '.tag_name // empty' | sed 's/^v//')
          fi
          if [ -z "$version" ]; then
            echo "::error::could not resolve the latest CLI release"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CLI version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build CLI
        run: bash ./build.sh
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload CLI exe to gofile
        run: |
          cd opencode
          EXE=packages/cli/dist/cli-windows-x64-baseline/bin/loophole.exe
          ls -la "$EXE"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          RESP=$(curl -s -F "file=@$EXE;filename=loophole-windows-x64.exe" "https://$SERVER.gofile.io/contents/uploadfile")
          echo "$RESP" | jq .
          LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
          if [ -z "$LINK" ]; then echo "## gofile upload failed" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          {
            echo "## Loophole CLI (windows x64)"
            echo ""
            echo "**Download:** $LINK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI exe artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-windows-exe
          path: opencode/packages/cli/dist/cli-windows-x64-baseline/bin/loophole.exe
          if-no-files-found: error
